<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>填写表单</title>
</head>
<body>
    
    <h3>用户信息表单</h3>
    <!-- 跳转到接收页面，用get方式传参 -->
    <form action="index.html" method="get">
        <p>姓名：<input type="text" name="username" required></p>
        <p>年龄：<input type="number" name="age" required></p>
        <p>手机号：<input type="tel" name="phone"></p>
        <p>性别：
            <input type="radio" name="gender" value="男">男
            <input type="radio" name="gender" value="女">女
        </p>
        <p>留言：<textarea name="msg"></textarea></p>
        <button type="submit">提交数据</button>
    </form>
    <a href="index.html" >主页</a>
</body>
</html>
